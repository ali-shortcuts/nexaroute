        '405':
          $ref: '#/components/responses/MethodNotAllowed'
    put:
      summary: Replace settings
      x-permission: config.write
      security:
      - adminSession: []
        csrfToken: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: Operation result; see the handler and the admin snapshot model.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
  /admin/api/client-keys:
    get:
      summary: List client keys (hashes only)
      x-permission: keys.manage
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientKeyList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
    post:
      summary: Create a client key (the secret is returned once)
      x-permission: keys.manage
      security:
      - adminSession: []
        csrfToken: []
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientKey'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
  /admin/api/client-keys/{id}:
    delete:
      summary: Delete one client key
      x-permission: keys.manage
      security:
      - adminSession: []
        csrfToken: []
      parameters:
      - name: id
        in: path
        required: true
        description: Resource identifier.
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: Operation result; see the handler and the admin snapshot model.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
