      summary: Read admin-managed settings
      x-permission: config.read
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: Operation result; see the handler and the admin snapshot model.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
