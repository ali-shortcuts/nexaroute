openapi: 3.1.0
info:
  title: NexaRoute Admin API
  version: 1.0.0
  description: 'The Admin API served by the NexaRoute gateway under /admin. This spec

    is generated from the implemented routes and is enforced by contract

    tests in internal/httpapi (admin_openapi_contract_test.go): the path

    set must equal the routes registered in the server, every operation''s

    method and x-permission must match the fail-closed authorization

    matrix, and live probes exercise the documented behavior.


    Authentication is a session cookie (nexaroute_admin_session) issued

    by the /admin/auth/* flow. Every state-changing operation additionally

    requires the double-submit CSRF pair: GET /admin/api/csrf-token sets

    the CSRF cookie and returns {"token": "..."}; send that value in the

    X-NexaRoute-CSRF header.


    Errors use one envelope: {"error": {"type": "gateway_error",

    "message": "..."}}. Pagination exists only where documented (the

    audit endpoint takes a `limit` query parameter and returns the newest

    events first). The Admin API has no idempotency keys and no PATCH:

    the authorization matrix rejects PATCH/OPTIONS/TRACE outright.

    '
servers:
- url: /
security:
- adminSession: []
components:
  securitySchemes:
    adminSession:
      type: apiKey
      in: cookie
      name: nexaroute_admin_session
      description: Admin session cookie issued by the /admin/auth/* flow.
    csrfToken:
      type: apiKey
      in: header
      name: X-NexaRoute-CSRF
      description: Double-submit CSRF token matching the CSRF cookie.
  schemas:
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - type
          - message
          properties:
            type:
              type: string
              const: gateway_error
            message:
              type: string
    CSRFToken:
      type: object
      required:
      - token
      properties:
        token:
          type: string
    AuditEvents:
      type: object
      required:
      - events
      properties:
        events:
          type: array
          items:
            type: object
            description: One audit event as stored by the security store.
    ActivityRequests:
      type: object
      required:
      - requests
      - counts
      properties:
        requests:
          type: array
          description: Request lifecycles ordered by first observation (newest first).
          items:
            type: object
        counts:
          type: object
          description: Bounded aggregate counts keyed by lifecycle state.
        generated_at:
          type: string
          format: date-time
        stale_after_seconds:
          type: integer
        epoch:
          type: integer
        cursor:
          type: integer
    ClientKey:
      type: object
      required:
      - id
      - budget_usd
      properties:
        id:
          type: string
        name:
          type: string
        tenant_id:
          type: string
        project_id:
          type: string
        team_id:
          type: string
        role:
          type: string
        allowed_models:
          type: array
          items:
            type: string
        allowed_routes:
          type: array
          items:
            type: string
        expires_at:
          type: string
        revoked:
          type: boolean
        rpm:
          type: integer
        tpm:
          type: integer
        budget_usd:
          type: number
          format: double
          minimum: 0
          description: Per-key budget in US dollars; always present. A value of 0 means no cap (unlimited).
        key:
          type: string
          description: Plaintext key, returned only once when created or rotated.
        key_shown_once:
          type: boolean
    ClientKeyList:
      type: object
      required:
      - keys
      properties:
        keys:
          type: array
          items:
            $ref: '#/components/schemas/ClientKey'
  responses:
    Unauthorized:
      description: No valid admin session.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: The session lacks the required permission.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: The request is malformed or fails validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    MethodNotAllowed:
      description: The method is not supported for this path.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
paths:
  /admin/auth/login:
    post:
      summary: Start admin authentication (OIDC redirect or local login, per configuration)
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: Operation result; see the handler and the admin snapshot model.
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
  /admin/auth/oidc/callback:
    get:
      summary: OIDC redirect callback
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: Operation result; see the handler and the admin snapshot model.
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
  /admin/auth/status:
    get:
      summary: Current admin session status
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: Operation result; see the handler and the admin snapshot model.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
  /admin/auth/logout:
    post:
      summary: End the admin session
      security:
      - adminSession: []
        csrfToken: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: Operation result; see the handler and the admin snapshot model.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
  /admin/api/snapshot:
    get:
      summary: Full admin snapshot of configuration and runtime state
      x-permission: config.read
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: Operation result; see the handler and the admin snapshot model.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
  /admin/api/csrf-token:
    get:
      summary: Issue the CSRF token pair for mutations (returns {token} and sets the CSRF cookie)
      x-permission: config.read
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CSRFToken'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
  /admin/api/audit:
    get:
      summary: Audit events, newest first; `limit` query parameter (1..1000, default 100)
      x-permission: audit.read
      parameters:
      - name: limit
        in: query
        required: false
        description: Maximum events to return, newest first (1..1000).
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 100
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEvents'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
  /admin/api/security-snapshot:
    get:
      summary: Consistent point-in-time snapshot of the security/audit store, taken from the gateway's own open store handle (the only supported live-snapshot path for the file-backed store; a broken audit chain is refused, and backends without snapshot support answer 501)
      x-permission: audit.read
      responses:
        '200':
          description: Raw security-store snapshot bytes (a bbolt database file that reopens as a normal store)
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
  /admin/api/events/stream:
    get:
      summary: Server-sent event stream of admin events
      x-permission: audit.read
      responses:
        '200':
          description: OK
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
  /admin/api/activity/requests:
    get:
      summary: Recent request lifecycles for the Live Activity dashboard; `limit` (1..256, default 100) and `window` seconds (1..3600) query parameters
      x-permission: audit.read
      parameters:
      - name: limit
        in: query
        required: false
        description: Maximum request lifecycles to return, newest first (1..256).
        schema:
          type: integer
          minimum: 1
          maximum: 256
          default: 100
      - name: window
        in: query
        required: false
        description: Only include requests first observed within this many seconds (1..3600).
        schema:
          type: integer
          minimum: 1
          maximum: 3600
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityRequests'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
  /admin/api/probe:
    post:
      summary: Run provider probes now
      x-permission: providers.write
      security:
      - adminSession: []
        csrfToken: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: Operation result; see the handler and the admin snapshot model.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
  /admin/api/autopilot:
    get:
      summary: |
        Read the policy canary autopilot status block: the incumbent and
        candidate policy versions, the current lifecycle state
        (draft/shadow/canary/promoted/rolled_back), canary share, in-flight
        leases, bounded transition history, and any rollback incidents. The
        response includes unsupported_signals. In the current HTTP adapter,
        the no-eligible rate is sourced from real data-plane outcomes
        (leased requests count as observations; no-candidate rejections are
        attributed to the policy version the request would have leased to),
        while budget-anomaly attribution is not yet sourced per policy
        lease; the gate reports missing coverage and holds promotion
        instead of treating missing telemetry as zero. GET only; no provider
        call is made.
      x-permission: routing.read
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: Operation result; see the handler and the admin snapshot model.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
    post:
      summary: |
        Perform one operator gate action on the policy canary autopilot.
        The JSON body names the action: "evaluate" records the current
        gate decision without changing state; "promote" promotes the
        candidate only when the gate itself permits (an operator cannot
        override missing or failing evidence — a refusal returns 409
        with the gate decision); "rollback" withdraws the candidate and
        restores the incumbent (routing policy only; in-flight leases
        finish on the version they started with). Successful actions
        appear in the status block's transition/incident history.
      x-permission: routing.write
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: Action outcome with the gate decision or transition/incident and the refreshed autopilot status.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Conflict — autopilot disabled, gate refuses promotion, or no candidate to roll back; the body carries the gate decision or current status explaining the refusal.
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
  /admin/api/route-preview:
    get:
      summary: |
        Preview a routing decision without any provider call. Replays the real
        candidate funnel (virtual endpoint resolution, capability/health/privacy
        gates, strategy ordering) against live runtime state for an
        operator-supplied requirement. Returns the ordered candidate list, the
        selected provider/model, and a redacted exclusion reason for every other
        deployment. Accepts query parameters: model, protocol, provider_type,
        tools, vision, stream, reasoning, min_context_window,
        require_no_training, session_key and selection_key (affinity evaluation
        only; keys are never echoed back). GET only; nothing is written.
      x-permission: routing.read
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: Operation result; see the handler and the admin snapshot model.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
  /admin/api/providers:
    get:
      summary: List providers
      x-permission: providers.read
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: Operation result; see the handler and the admin snapshot model.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
    post:
      summary: Create a provider
      x-permission: providers.write
      security:
      - adminSession: []
        csrfToken: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: Operation result; see the handler and the admin snapshot model.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
  /admin/api/providers/{id}:
    get:
      summary: Get one provider
      x-permission: providers.read
      parameters:
      - name: id
        in: path
        required: true
        description: Resource identifier.
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: Operation result; see the handler and the admin snapshot model.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
    put:
      summary: Replace one provider
      x-permission: providers.write
      security:
      - adminSession: []
        csrfToken: []
      parameters:
      - name: id
        in: path
        required: true
        description: Resource identifier.
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: Operation result; see the handler and the admin snapshot model.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
    delete:
      summary: Delete one provider
      x-permission: providers.write
      security:
      - adminSession: []
        csrfToken: []
      parameters:
      - name: id
        in: path
        required: true
        description: Resource identifier.
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: Operation result; see the handler and the admin snapshot model.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
  /admin/api/provider-presets:
    get:
      summary: List provider presets
      x-permission: providers.read
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: Operation result; see the handler and the admin snapshot model.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
  /admin/api/provider-check:
    post:
      summary: Check a provider configuration without saving
      x-permission: providers.write
      security:
      - adminSession: []
        csrfToken: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: Operation result; see the handler and the admin snapshot model.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
  /admin/api/connection-test:
    post:
      summary: Bounded one-click connection test for a saved deployment
      x-permission: providers.write
      security:
      - adminSession: []
        csrfToken: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: Connection test report; see the handler and the admin snapshot model.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
  /admin/api/provider-test:
    post:
      summary: Test a provider with a live request
      x-permission: providers.write
      security:
      - adminSession: []
        csrfToken: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: Operation result; see the handler and the admin snapshot model.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
  /admin/api/provider-discover:
    post:
      summary: Discover models for a provider
      x-permission: providers.write
      security:
      - adminSession: []
        csrfToken: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: Operation result; see the handler and the admin snapshot model.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
  /admin/api/compat:
    get:
      summary: Compatibility matrix
      x-permission: providers.read
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: Operation result; see the handler and the admin snapshot model.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
  /admin/api/compat/reset:
    post:
      summary: Reset compatibility state
      x-permission: providers.write
      security:
      - adminSession: []
        csrfToken: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: Operation result; see the handler and the admin snapshot model.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
  /admin/api/settings:
