name: Temporary compatibility formatter

on:
  push:
    branches:
      - feat/supervisor-gateway-audit

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/supervisor-gateway-audit
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - run: gofmt -w cmd internal
      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cmd internal
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Format compatibility hardening changes"
          git push origin HEAD:feat/supervisor-gateway-audit
