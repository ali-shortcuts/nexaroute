name: v0.25.0 OxionAI OpenAI-family + Claude-family live acceptance

# One manual run tests two operator-selected model IDs through OxionAI's
# documented OpenAI-compatible Chat Completions endpoint. It does not claim
# direct OpenAI or direct Anthropic interoperability.
on:
  workflow_dispatch:
    inputs:
      openai_family_model:
        description: "Exact enabled OpenAI-family model ID from OxionAI /v1/models"
        required: true
        type: string
      claude_family_model:
        description: "Exact enabled Claude-family model ID from OxionAI /v1/models"
        required: true
        type: string
      openai_family_input_cost_per_mtok:
        description: "OxionAI input price in USD per 1M tokens for this exact model"
        required: true
        type: string
      openai_family_output_cost_per_mtok:
        description: "OxionAI output price in USD per 1M tokens for this exact model"
        required: true
        type: string
      claude_family_input_cost_per_mtok:
        description: "OxionAI input price in USD per 1M tokens for this exact model"
        required: true
        type: string
      claude_family_output_cost_per_mtok:
        description: "OxionAI output price in USD per 1M tokens for this exact model"
        required: true
        type: string
      max_cost_usd_total:
        description: "Operator-approved total estimate/observed-cost ceiling across both model runs (USD)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: v0250-oxionai-acceptance
  cancel-in-progress: false

jobs:
  provider-acceptance:
    name: OxionAI live canaries (OpenAI-family + Claude-family)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: conformance-live
    steps:
      - name: Checkout exact selected candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Verify this is the current candidate branch tip
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REPOSITORY" != "ali-shortcuts/nexaroute" ]]; then
            echo "::error::Run this acceptance only in ali-shortcuts/nexaroute."
            exit 1
          fi
          case "$GITHUB_REF" in
            refs/heads/main|refs/heads/feat/issue-646-oxionai-acceptance) ;;
            *) echo "::error::Dispatch only from main or the approved issue #646 candidate branch."; exit 1 ;;
          esac
          git fetch --no-tags origin "$GITHUB_REF" --depth=1
          candidate_sha="$(git rev-parse FETCH_HEAD)"
          if [[ "$candidate_sha" != "$GITHUB_SHA" ]]; then
            echo "::error::The dispatch SHA is not the selected branch tip; refresh the branch and dispatch again."
            exit 1
          fi
          echo "OxionAI acceptance candidate SHA: $GITHUB_SHA"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          cache: false

      - name: Validate operator inputs and protected credential
        env:
          OXIONAI_API_KEY: ${{ secrets.NEXAROUTE_OXIONAI_API_KEY }}
          OPENAI_FAMILY_MODEL: ${{ inputs.openai_family_model }}
          CLAUDE_FAMILY_MODEL: ${{ inputs.claude_family_model }}
          OPENAI_FAMILY_INPUT_PRICE: ${{ inputs.openai_family_input_cost_per_mtok }}
          OPENAI_FAMILY_OUTPUT_PRICE: ${{ inputs.openai_family_output_cost_per_mtok }}
          CLAUDE_FAMILY_INPUT_PRICE: ${{ inputs.claude_family_input_cost_per_mtok }}
          CLAUDE_FAMILY_OUTPUT_PRICE: ${{ inputs.claude_family_output_cost_per_mtok }}
          MAX_COST_TOTAL: ${{ inputs.max_cost_usd_total }}
        shell: bash
        run: |
          set -euo pipefail
          # Check presence only. Never print or persist the credential value.
          [[ -n "$OXIONAI_API_KEY" ]] || { echo "::error::NEXAROUTE_OXIONAI_API_KEY is missing from conformance-live."; exit 1; }
          [[ -n "$OPENAI_FAMILY_MODEL" && -n "$CLAUDE_FAMILY_MODEL" ]] || { echo "::error::Both exact model IDs are required."; exit 1; }
          for value in "$OPENAI_FAMILY_INPUT_PRICE" "$OPENAI_FAMILY_OUTPUT_PRICE" "$CLAUDE_FAMILY_INPUT_PRICE" "$CLAUDE_FAMILY_OUTPUT_PRICE" "$MAX_COST_TOTAL"; do
            if ! [[ "$value" =~ ^[0-9]+([.][0-9]+)?$ ]] || ! awk -v n="$value" 'BEGIN { exit !(n > 0) }'; then
              echo "::error::Model prices and total cost ceiling must be positive decimal USD values."
              exit 1
            fi
          done
          mkdir -p .artifacts/provider-v025

      - name: Build the candidate canary binary
        run: |
          set -euo pipefail
          mkdir -p bin
          go build -trimpath -o ./bin/nexaroute ./cmd/gateway

      - name: Run both bounded OxionAI canaries
        id: canaries
        env:
          OXIONAI_API_KEY: ${{ secrets.NEXAROUTE_OXIONAI_API_KEY }}
          OPENAI_FAMILY_MODEL: ${{ inputs.openai_family_model }}
          CLAUDE_FAMILY_MODEL: ${{ inputs.claude_family_model }}
          OPENAI_FAMILY_INPUT_PRICE: ${{ inputs.openai_family_input_cost_per_mtok }}
          OPENAI_FAMILY_OUTPUT_PRICE: ${{ inputs.openai_family_output_cost_per_mtok }}
          CLAUDE_FAMILY_INPUT_PRICE: ${{ inputs.claude_family_input_cost_per_mtok }}
          CLAUDE_FAMILY_OUTPUT_PRICE: ${{ inputs.claude_family_output_cost_per_mtok }}
          MAX_COST_TOTAL: ${{ inputs.max_cost_usd_total }}
        shell: bash
        run: |
          set -uo pipefail
          out=".artifacts/provider-v025"
          max_cost_per_model="$(python3 -c 'from decimal import Decimal; import os; print(Decimal(os.environ["MAX_COST_TOTAL"]) / 2)')"
          # Each model is capped at half of the operator-approved total. Thus
          # the two sequential runs cannot each consume the full total ceiling.
          # Seven acceptance scenarios, at most seven calls, 4,096 estimated
          # input tokens and 512 output tokens per model. The one secret stays
          # in the environment and is never passed as a CLI argument or written.
          NEXAROUTE_CANARY_API_KEY="$OXIONAI_API_KEY" ./bin/nexaroute conformance canary \
            --acknowledge-cost --preset openai --model "$OPENAI_FAMILY_MODEL" \
            --base-url https://oxionai.com/v1 --auth-mode bearer \
            --scenarios acceptance --max-calls 7 --max-input-tokens 4096 \
            --max-output-tokens 512 --call-timeout 30s --overall-timeout 3m \
            --input-cost-per-mtok "$OPENAI_FAMILY_INPUT_PRICE" \
            --output-cost-per-mtok "$OPENAI_FAMILY_OUTPUT_PRICE" \
            --max-cost-usd "$max_cost_per_model" \
            --out "$out/openai-family.json" >/dev/null 2>"$RUNNER_TEMP/openai-family-canary.stderr"
          openai_family_exit=$?

          NEXAROUTE_CANARY_API_KEY="$OXIONAI_API_KEY" ./bin/nexaroute conformance canary \
            --acknowledge-cost --preset openai --model "$CLAUDE_FAMILY_MODEL" \
            --base-url https://oxionai.com/v1 --auth-mode bearer \
            --scenarios acceptance --max-calls 7 --max-input-tokens 4096 \
            --max-output-tokens 512 --call-timeout 30s --overall-timeout 3m \
            --input-cost-per-mtok "$CLAUDE_FAMILY_INPUT_PRICE" \
            --output-cost-per-mtok "$CLAUDE_FAMILY_OUTPUT_PRICE" \
            --max-cost-usd "$max_cost_per_model" \
            --out "$out/claude-family.json" >/dev/null 2>"$RUNNER_TEMP/claude-family-canary.stderr"
          claude_family_exit=$?

          echo "openai_family_exit=$openai_family_exit" >> "$GITHUB_OUTPUT"
          echo "claude_family_exit=$claude_family_exit" >> "$GITHUB_OUTPUT"
          # Report validation determines the job verdict and preserves both
          # reports for diagnosis if one canary exits non-zero.
          exit 0

      - name: Validate both live reports and create the evidence summary
        if: always()
        env:
          OPENAI_FAMILY_MODEL: ${{ inputs.openai_family_model }}
          CLAUDE_FAMILY_MODEL: ${{ inputs.claude_family_model }}
          MAX_COST_TOTAL: ${{ inputs.max_cost_usd_total }}
          OPENAI_FAMILY_EXIT: ${{ steps.canaries.outputs.openai_family_exit }}
          CLAUDE_FAMILY_EXIT: ${{ steps.canaries.outputs.claude_family_exit }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import math
          import os
          import subprocess
          import sys
          from pathlib import Path
          from urllib.parse import urlsplit

          root = Path(".artifacts/provider-v025")
          root.mkdir(parents=True, exist_ok=True)
          expected = {
              "openai-family": {"model": os.environ.get("OPENAI_FAMILY_MODEL", "")},
              "claude-family": {"model": os.environ.get("CLAUDE_FAMILY_MODEL", "")},
          }
          scenario_ids = {
              "text", "stream", "stream_usage", "tools",
              "tool_result", "auth_failure", "error_envelope",
          }
          try:
              max_total = float(os.environ["MAX_COST_TOTAL"])
          except (KeyError, ValueError):
              max_total = 0.0
          max_per_model = max_total / 2 if max_total > 0 else 0.0
          errors = []
          model_records = []
          total_estimated = 0.0
          observed_values = []

          for name, want in expected.items():
              path = root / f"{name}.json"
              record = {"model_role": name, "report": str(path), "result": "FAIL"}
              if not path.is_file():
                  errors.append(f"{name}: report missing (canary exit={os.environ.get(name.upper().replace('-', '_') + '_EXIT', 'NOT_RUN')})")
                  model_records.append(record)
                  continue

              check = subprocess.run(
                  [sys.executable, "scripts/check-acceptance-report.py",
                   "--report", str(path), "--require-live"],
                  text=True, capture_output=True,
              )
              if check.returncode != 0:
                  errors.append(f"{name}: report validator failed: {(check.stdout + check.stderr).strip()[:1200]}")
                  model_records.append(record)
                  continue

              try:
                  report = json.loads(path.read_text(encoding="utf-8"))
              except (OSError, ValueError) as exc:
                  errors.append(f"{name}: invalid JSON report: {exc}")
                  model_records.append(record)
                  continue

              provider = report.get("provider") or {}
              limits = report.get("limits") or {}
              scenarios = report.get("scenarios") or []
              actual_ids = [item.get("id") for item in scenarios if isinstance(item, dict)]
              statuses = {item.get("id"): item.get("status") for item in scenarios if isinstance(item, dict)}
              base_url = provider.get("base_url", "")
              host = urlsplit(base_url).hostname
              estimated = limits.get("estimated_cost_usd")
              observed = limits.get("observed_cost_usd")
              calls_used = limits.get("calls_used", 999)
              estimate_ok = isinstance(estimated, (int, float)) and math.isfinite(estimated) and 0 <= estimated <= max_per_model
              observed_ok = observed is None or (isinstance(observed, (int, float)) and math.isfinite(observed) and 0 <= observed <= max_per_model)

              checks = [
                  (report.get("schema") == "conformance.live-canary.v1", "wrong report schema"),
                  (report.get("outcome") == "PASS", f"overall outcome is {report.get('outcome')}"),
                  (provider.get("dialect") == "openai_compatible", f"wrong dialect: {provider.get('dialect')}"),
                  (host == "oxionai.com" and base_url == "https://oxionai.com/v1", f"wrong OxionAI base URL: {base_url}"),
                  (provider.get("model") == want["model"], "report model does not match dispatch input"),
                  (set(actual_ids) == scenario_ids and len(actual_ids) == len(scenario_ids), "selected scenario set is incomplete or contains duplicates"),
                  (all(statuses.get(sid) == "PASS" for sid in scenario_ids), "one or more acceptance scenarios did not PASS"),
                  (limits.get("max_calls") == 7 and isinstance(calls_used, int) and calls_used <= 7, "call ceiling or calls-used mismatch"),
                  (limits.get("max_input_tokens") == 4096, "input-token estimate bound mismatch"),
                  (limits.get("max_output_tokens") == 512, "output-token ceiling mismatch"),
                  (limits.get("cost_estimate_known") is True and estimate_ok, "preflight estimate is unknown or exceeds half of the approved total ceiling"),
                  (observed_ok, "observed cost exceeds half of the approved total ceiling"),
              ]
              bad = [message for ok, message in checks if not ok]
              if bad:
                  errors.extend(f"{name}: {message}" for message in bad)
                  model_records.append(record)
                  continue

              record["result"] = "PASS"
              record["dialect"] = provider["dialect"]
              record["base_url"] = base_url
              record["model"] = provider["model"]
              record["generated_at"] = report.get("generated_at")
              record["scenarios"] = {sid: statuses[sid] for sid in sorted(scenario_ids)}
              record["calls_used"] = calls_used
              record["estimated_cost_usd"] = estimated
              record["observed_cost_usd"] = observed
              total_estimated += estimated
              if observed is not None:
                  observed_values.append(observed)
              model_records.append(record)

          if total_estimated > max_total + 1e-12:
              errors.append("combined preflight estimates exceed the operator-approved total cost ceiling")
          total_observed = sum(observed_values) if len(observed_values) == len(expected) else None
          if total_observed is not None and total_observed > max_total + 1e-12:
              errors.append("combined observed usage exceeds the operator-approved total cost ceiling")

          summary = {
              "schema": "nexaroute.v0250-oxionai-acceptance.v1",
              "release": "v0.25.0",
              "commit": os.environ.get("GITHUB_SHA", ""),
              "run_id": int(os.environ.get("GITHUB_RUN_ID", "0")),
              "event": os.environ.get("GITHUB_EVENT_NAME", ""),
              "result": "PASS" if not errors else "FAIL",
              "provider": "oxionai",
              "base_url": "https://oxionai.com/v1",
              "protocol": "openai_compatible",
              "model_scope": ["openai-family", "claude-family"],
              "max_cost_usd_total": max_total,
              "estimated_cost_usd_total": total_estimated,
              "observed_cost_usd_total": total_observed,
              "models": model_records,
              "errors": errors,
          }
          (root / "summary.json").write_text(json.dumps(summary, indent=2) + "\n", encoding="utf-8")
          if errors:
              for error in errors:
                  print(f"::error title=v0.25.0 OxionAI acceptance::{error}")
              sys.exit(1)
          print("Both OxionAI model-family canaries PASS; seven scenarios each; OpenAI-compatible live endpoint and combined cost ceiling verified.")
          PY

      - name: Upload combined OxionAI acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v0250-oxionai-acceptance-${{ github.sha }}-${{ github.run_id }}
          path: .artifacts/provider-v025/
          if-no-files-found: error
          retention-days: 90
