name: Issue 404 formal flake-hunt acceptance

on:
  push:
    branches:
      - supervisor/issue404-flaky-currentmain

permissions:
  contents: read
  checks: read

concurrency:
  group: issue404-flake-hunt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  formal-statistical-gate:
    name: 50 loaded suites + 5 verify passes
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      checks: read
    steps:
      - name: Checkout exact source SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          cache: false

      - name: Record exact source identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [[ "$actual" != "$EXPECTED_SHA" ]]; then
            echo "Refusing gate: checkout $actual != expected $EXPECTED_SHA" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/flake-hunt-logs"
          {
            printf 'source_sha=%s\n' "$actual"
            printf 'workflow_run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'workflow_run_attempt=%s\n' "$GITHUB_RUN_ATTEMPT"
            printf 'started_at_utc=%s\n' "$(date -u +%FT%TZ)"
            printf 'preflight_result=waiting-for-exact-sha-checks\n'
          } > "$RUNNER_TEMP/flake-hunt-meta.txt"

      - name: Wait for all ordinary exact-SHA CI and security checks
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          meta="$RUNNER_TEMP/flake-hunt-meta.txt"
          # Redis is intentionally required twice: the main CI matrix and the
          # standalone Redis integration workflow both produce check runs.
          required=(
            "verify:1"
            "container:1"
            "fuzz-smoke:1"
            "integration-postgres:1"
            "integration-redis:2"
            "CodeQL (Go):1"
            "Go vulnerability scan:1"
            "CodeQL:1"
          )

          for attempt in $(seq 1 180); do
            checks="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${EXPECTED_SHA}/check-runs?per_page=100")"
            waiting=0
            for item in "${required[@]}"; do
              name="${item%:*}"
              minimum="${item##*:}"
              count="$(jq -r --arg n "$name" '[.check_runs[] | select(.name == $n)] | length' <<< "$checks")"
              if (( count < minimum )); then
                echo "Waiting for $name check runs: observed $count, require at least $minimum (poll $attempt/180)"
                waiting=1
                continue
              fi

              bad="$(jq -r --arg n "$name" '[.check_runs[] | select(.name == $n and .status == "completed" and .conclusion != "success")] | length' <<< "$checks")"
              if (( bad > 0 )); then
                echo "Required check $name completed non-successfully on $EXPECTED_SHA:" >&2
                jq -r --arg n "$name" '.check_runs[] | select(.name == $n and .status == "completed" and .conclusion != "success") | "  (.name): (.conclusion) — (.html_url)"' <<< "$checks" >&2
                printf 'preflight_result=failed:%s\n' "$name" >> "$meta"
                exit 1
              fi

              pending="$(jq -r --arg n "$name" '[.check_runs[] | select(.name == $n and .status != "completed")] | length' <<< "$checks")"
              if (( pending > 0 )); then
                echo "Waiting for $pending active $name check run(s) (poll $attempt/180)"
                waiting=1
              fi
            done

            if (( waiting == 0 )); then
              echo "All required ordinary checks are terminal-success on exact SHA $EXPECTED_SHA."
              printf 'preflight_result=green\n' >> "$meta"
              printf 'preflight_completed_at_utc=%s\n' "$(date -u +%FT%TZ)" >> "$meta"
              exit 0
            fi
            sleep 30
          done

          echo "Timed out waiting for ordinary checks on exact SHA $EXPECTED_SHA." >&2
          printf 'preflight_result=timeout\n' >> "$meta"
          exit 1

      - name: Run the formal 50+5 acceptance gate
        shell: bash
        env:
          FLAKE_HUNT_LOGDIR: ${{ runner.temp }}/flake-hunt-logs
          FLAKE_HUNT_TMP_ROOT: ${{ runner.temp }}
        run: |
          set -uo pipefail
          actual="$(git rev-parse HEAD)"
          if [[ "$actual" != "$GITHUB_SHA" ]]; then
            echo "Refusing gate: source SHA changed to $actual" >&2
            exit 1
          fi
          set +e
          ./scripts/flake-hunt.sh 2>&1 | tee "$RUNNER_TEMP/flake-hunt-logs/flake-hunt-console.log"
          rc=${PIPESTATUS[0]}
          set -e
          {
            printf 'flake_hunt_exit_code=%s\n' "$rc"
            printf 'finished_at_utc=%s\n' "$(date -u +%FT%TZ)"
          } >> "$RUNNER_TEMP/flake-hunt-meta.txt"
          exit "$rc"

      - name: Preserve raw logs and exact-SHA evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: flake-hunt-${{ github.sha }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/flake-hunt-meta.txt
            ${{ runner.temp }}/flake-hunt-logs/
          retention-days: 90
          if-no-files-found: error
