name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false

      - name: Repository cleanliness
        shell: bash
        run: |
          set -euo pipefail
          bad_files="$(git ls-files | grep -Ei '(^|/)(backup|backups|old|legacy)(/|$)|\.bak$|\.orig$|\.rej$|~$' || true)"
          if [ -n "$bad_files" ]; then
            echo "Forbidden backup/legacy artifacts:"
            echo "$bad_files"
            exit 1
          fi
          if git grep -nE 'LoadBackup|adminRollback|/admin/api/rollback|rollbackBtn|ulg_admin_key|ULG_CONFIG|ULG_LISTEN|ULG_ADMIN_KEY|ULG_ADMIN_BIND_LOCAL_ONLY|universal-llm-gateway' -- . ':(exclude).github/workflows/ci.yml'; then
            echo "Forbidden backup/legacy identifiers remain in active source/docs."
            exit 1
          fi

      - name: Full verification
        run: ./scripts/verify.sh

      - name: Bounded stress checks
        run: ./scripts/stress.sh

      - name: Command and browser launcher check
        run: python3 scripts/test-launcher.py

      - name: Local runtime smoke test
        run: ./scripts/smoke-local.sh

      - name: Installer smoke test
        shell: bash
        run: |
          set -euo pipefail
          tmp_home="$(mktemp -d)"
          trap 'rm -rf "$tmp_home"' EXIT
          HOME="$tmp_home" ./install-user.sh
          test -x "$tmp_home/.local/bin/nexaroute"
          expected_version="$(sed -n 's/^const Version = "\([^"]*\)"/NexaRoute v\1/p' internal/buildinfo/version.go)"
          test -n "$expected_version"
          test "$("$tmp_home/.local/bin/nexaroute" -version)" = "$expected_version"
          test -f "$tmp_home/.config/nexaroute/config.json"
          test "$(stat -c '%a' "$tmp_home/.config/nexaroute/config.json")" = "600"
          test ! -e "$tmp_home/.config/nexaroute/config.json.bak"

      - name: Docker build
        run: docker build --tag nexaroute-ci:current .

      - name: Docker runtime smoke test
        shell: bash
        run: |
          set -euo pipefail
          cid="$(docker run -d -p 18081:8080 -e NEXAROUTE_ADMIN_KEY=ci-admin nexaroute-ci:current)"
          cleanup() {
            docker rm -f "$cid" >/dev/null 2>&1 || true
            rm -f /tmp/nexaroute-docker-backup-check
          }
          trap cleanup EXIT
          for _ in $(seq 1 80); do
            if curl -fsS http://127.0.0.1:18081/healthz >/dev/null 2>&1; then
              break
            fi
            sleep 0.1
          done
          curl -fsS http://127.0.0.1:18081/healthz >/dev/null
          body='{"provider":{"id":"docker-smoke","name":"Docker Smoke","type":"openai_compatible","base_url":"http://127.0.0.1:19999/v1","auth_mode":"none","enabled":false,"models":[{"id":"m1","model":"model-1","enabled":true,"priority":1,"weight":1,"capabilities":{"streaming":true,"tools":true,"vision":false,"reasoning":false}}]},"preserve_secret":false}'
          code="$(curl -sS -o /tmp/docker-smoke.json -w '%{http_code}' \
            -H 'x-admin-key: ci-admin' \
            -H 'content-type: application/json' \
            --data-binary "$body" \
            http://127.0.0.1:18081/admin/api/providers)"
          if [ "$code" != "201" ]; then
            cat /tmp/docker-smoke.json
            exit 1
          fi
          if docker cp "$cid:/config/config.json.bak" /tmp/nexaroute-docker-backup-check >/dev/null 2>&1; then
            echo "Docker runtime created a forbidden config backup."
            exit 1
          fi
