name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true

      - name: Format check
        run: |
          out="$(gofmt -l cmd internal)"
          if [ -n "$out" ]; then
            echo "$out"
            exit 1
          fi

      - name: Unit and integration tests
        run: go test -shuffle=on -count=3 ./...

      - name: Vet
        run: go vet ./...

      - name: Web UI syntax
        run: node --check internal/httpapi/web/app.js

      - name: Race detector
        run: go test -race -shuffle=on -count=1 ./...

      - name: Linux amd64 build
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64
        run: go build -trimpath -ldflags='-s -w' -o /tmp/nexaroute-linux-amd64 ./cmd/gateway

      - name: Linux arm64 build
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: arm64
        run: go build -trimpath -ldflags='-s -w' -o /tmp/nexaroute-linux-arm64 ./cmd/gateway
