name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          cache: false

      - name: Repository cleanliness
        shell: bash
        run: |
          set -euo pipefail
          bad_files="$(git ls-files | grep -Ei '(^|/)(backup|backups|old|legacy)(/|$)|\.bak$|\.orig$|\.rej$|~$' || true)"
          if [ -n "$bad_files" ]; then
            echo "Forbidden backup/legacy artifacts:"
            echo "$bad_files"
            exit 1
          fi
          if git grep -nE 'LoadBackup|adminRollback|/admin/api/rollback|rollbackBtn|ulg_admin_key|ULG_CONFIG|ULG_LISTEN|ULG_ADMIN_KEY|ULG_ADMIN_BIND_LOCAL_ONLY|universal-llm-gateway' -- . ':(exclude).github/workflows'; then
            echo "Forbidden backup/legacy identifiers remain in active source/docs."
            exit 1
          fi

      - name: Full verification
        run: |
          set -o pipefail
          ./scripts/verify.sh 2>&1 | tee /tmp/verify.log || {
            msg=$(tail -n 80 /tmp/verify.log | sed -e "s/%/%25/g" -e "s/\r//g" | tr "\n" "\001" | sed "s/\x01/%0A/g")
            echo "::error title=verify-tail::${msg}"
            exit 1
          }

      - name: Bounded stress checks
        run: ./scripts/stress.sh

      - name: Local runtime smoke test
        run: ./scripts/smoke-local.sh

      - name: Browser acceptance test
        run: |
          python3 -m pip install --user playwright
          python3 -m playwright install --with-deps chromium
          python3 scripts/test-browser-e2e.py

      - name: Release packaging and installer lifecycle tests
        run: |
          ./scripts/build-release.sh v0.7.0
          ./scripts/test-install.sh

      - name: Docker build
        run: docker build --tag nexaroute-ci:current .

      - name: Docker runtime smoke test
        shell: bash
        run: |
          set -euo pipefail
          cid="$(docker run -d -p 18081:8080 -e NEXAROUTE_ADMIN_KEY=ci-admin nexaroute-ci:current)"
          cleanup() {
            docker rm -f "$cid" >/dev/null 2>&1 || true
            rm -f /tmp/nexaroute-docker-backup-check
          }
          trap cleanup EXIT
          for _ in $(seq 1 80); do
            if curl -fsS http://127.0.0.1:18081/healthz >/dev/null 2>&1; then
              break
            fi
            sleep 0.1
          done
          if ! curl -fsS http://127.0.0.1:18081/healthz >/dev/null; then
            docker logs "$cid" || true
            exit 1
          fi
          body='{"provider":{"id":"docker-smoke","name":"Docker Smoke","type":"openai_compatible","base_url":"http://127.0.0.1:19999/v1","auth_mode":"none","enabled":false,"models":[{"id":"m1","model":"model-1","enabled":true,"priority":1,"weight":1,"capabilities":{"streaming":true,"tools":true,"vision":false,"reasoning":false}}]},"preserve_secret":false}'
          code="$(curl -sS -o /tmp/docker-smoke.json -w '%{http_code}' \
            -H 'x-admin-key: ci-admin' \
            -H 'content-type: application/json' \
            --data-binary "$body" \
            http://127.0.0.1:18081/admin/api/providers)"
          if [ "$code" != "201" ]; then
            cat /tmp/docker-smoke.json
            exit 1
          fi
          if docker cp "$cid:/config/config.json.bak" /tmp/nexaroute-docker-backup-check >/dev/null 2>&1; then
            echo "Docker runtime created a forbidden config backup."
            exit 1
          fi
