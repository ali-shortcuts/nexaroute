name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Full verification
        run: ./scripts/verify.sh

      - name: Local runtime smoke test
        run: ./scripts/smoke-local.sh

      - name: Installer smoke test
        shell: bash
        run: |
          set -euo pipefail
          tmp_home="$(mktemp -d)"
          trap 'rm -rf "$tmp_home"' EXIT
          HOME="$tmp_home" ./install-user.sh
          test -x "$tmp_home/.local/bin/nexaroute"
          "$tmp_home/.local/bin/nexaroute" -version | grep -F "NexaRoute v0.3"
          test -f "$tmp_home/.config/nexaroute/config.json"
          test "$(stat -c '%a' "$tmp_home/.config/nexaroute/config.json")" = "600"

      - name: Docker build
        run: docker build --tag nexaroute-ci:0.3 .
