name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          cache: false

      - name: Repository cleanliness
        shell: bash
        run: |
          set -euo pipefail
          bad_files="$(git ls-files | grep -Ei '(^|/)(backup|backups|old|legacy)(/|$)|\.bak$|\.orig$|\.rej$|~$' || true)"
          if [ -n "$bad_files" ]; then
            echo "Forbidden backup/legacy artifacts:"
            echo "$bad_files"
            exit 1
          fi
          if git grep -nE 'LoadBackup|adminRollback|/admin/api/rollback|rollbackBtn|ulg_admin_key|ULG_CONFIG|ULG_LISTEN|ULG_ADMIN_KEY|ULG_ADMIN_BIND_LOCAL_ONLY|universal-llm-gateway' -- . ':(exclude).github/workflows'; then
            echo "Forbidden backup/legacy identifiers remain in active source/docs."
            exit 1
          fi

      - name: Full verification
        run: |
          set -o pipefail
          ./scripts/verify.sh 2>&1 | tee /tmp/verify.log || {
            msg=$(tail -n 80 /tmp/verify.log | sed -e "s/%/%25/g" -e "s/\r//g" | tr "\n" "\001" | sed "s/\x01/%0A/g")
            echo "::error title=verify-tail::${msg}"
            exit 1
          }

      - name: Bounded stress checks
        run: ./scripts/stress.sh

      - name: Local runtime smoke test
        run: ./scripts/smoke-local.sh

      - name: Browser acceptance test
        # Pinned, not floating: the Playwright version pins the browser
        # revision it downloads, so a re-run provisions the same
        # browser. The runner executes all three existing suites
        # (browser-e2e, browser-e2e-502, live-visual-agent) in order,
        # reports PASS/FAIL/SKIPPED per suite, and fails the job on a
        # skip -- a skipped suite is never a successful acceptance run.
        # It also isolates screenshot/evidence output under the
        # diagnostics directory instead of the checkout.
        run: |
          python3 -m pip install --user "playwright==1.55.0"
          python3 -m playwright install --with-deps chromium
          python3 scripts/run-browser-acceptance.py --diagnostics-dir "${{ github.workspace }}/.artifacts/browser-acceptance"

      - name: Summarize browser acceptance
        if: always()
        run: |
          {
            echo '## Browser acceptance'
            if [ -f "${{ github.workspace }}/.artifacts/browser-acceptance/summary.json" ]; then
              echo '```json'
              cat "${{ github.workspace }}/.artifacts/browser-acceptance/summary.json"
              echo '```'
            else
              echo 'No summary.json: the acceptance step did not reach the runner (dependency provisioning failed). That is a failure of the acceptance run, not a pass.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve browser acceptance diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-acceptance-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ github.workspace }}/.artifacts/browser-acceptance/
          retention-days: 90
          if-no-files-found: warn

      - name: Release packaging and installer lifecycle tests
        run: |
          if ./scripts/build-release.sh >/dev/null 2>&1; then
            echo 'build-release.sh must reject a missing version argument' >&2
            exit 1
          fi
          ./scripts/build-release.sh v0.24.0
          ./scripts/test-install.sh

      - name: Docker build
        run: docker build --tag nexaroute-ci:current .

      - name: Docker runtime smoke test
        shell: bash
        run: |
          set -euo pipefail
          cid="$(docker run -d -p 18081:8080 -e NEXAROUTE_ADMIN_KEY=ci-admin nexaroute-ci:current)"
          cleanup() {
            docker rm -f "$cid" >/dev/null 2>&1 || true
            rm -f /tmp/nexaroute-docker-backup-check
          }
          trap cleanup EXIT
          for _ in $(seq 1 80); do
            if curl -fsS http://127.0.0.1:18081/healthz >/dev/null 2>&1; then
              break
            fi
            sleep 0.1
          done
          if ! curl -fsS http://127.0.0.1:18081/healthz >/dev/null; then
            docker logs "$cid" || true
            exit 1
          fi
          body='{"provider":{"id":"docker-smoke","name":"Docker Smoke","type":"openai_compatible","base_url":"http://127.0.0.1:19999/v1","auth_mode":"none","enabled":false,"models":[{"id":"m1","model":"model-1","enabled":true,"priority":1,"weight":1,"capabilities":{"streaming":true,"tools":true,"vision":false,"reasoning":false}}]},"preserve_secret":false}'
          code="$(curl -sS -o /tmp/docker-smoke.json -w '%{http_code}' \
            -H 'x-admin-key: ci-admin' \
            -H 'content-type: application/json' \
            --data-binary "$body" \
            http://127.0.0.1:18081/admin/api/providers)"
          if [ "$code" != "201" ]; then
            cat /tmp/docker-smoke.json
            exit 1
          fi
          if docker cp "$cid:/config/config.json.bak" /tmp/nexaroute-docker-backup-check >/dev/null 2>&1; then
            echo "Docker runtime created a forbidden config backup."
            exit 1
          fi

  ci-soak-smoke:
    # Bounded CI smoke/stress + recovery evidence (issue #664). This is
    # the PR-suitable half of the soak story: stress selectors identical
    # to scripts/stress.sh, fixed-iteration soak tests, loopback
    # outage/cancellation tests, and one short race soak stage, all
    # recorded per-stage (PASS/FAIL/SKIPPED/BLOCKED) in a sanitized
    # summary. It runs in parallel with verify, so it does not slow
    # that job down; it never makes paid provider calls, never touches
    # a production cluster, and never needs credentials. The long-form
    # multi-hour soak is deliberately NOT here: it is opt-in via the
    # Soak workflow (workflow_dispatch) on a suitable runner.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          cache: false

      - name: Bounded CI soak smoke (record reproducible evidence)
        env:
          NEXAROUTE_CI_SMOKE_OUT: ${{ github.workspace }}/.artifacts/ci-soak-smoke
        run: ./scripts/ci-soak-smoke.sh

      - name: Summarize CI soak smoke
        if: always()
        run: |
          {
            echo '## CI soak smoke'
            summary="$(find "${{ github.workspace }}/.artifacts/ci-soak-smoke" -name summary.md 2>/dev/null | head -n 1 || true)"
            if [ -n "$summary" ]; then
              cat "$summary"
            else
              echo 'No summary.md: the smoke script did not reach its report writer. That is a failure of the smoke run, not a pass.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve CI soak smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-soak-smoke-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ github.workspace }}/.artifacts/ci-soak-smoke/
          retention-days: 90
          if-no-files-found: warn

  fuzz-smoke:
    # Wave C-2 (#403): bounded deterministic fuzz smoke over the fuzzed
    # attack surface (canonical codecs + stream pump framing, egress
    # classifiers, budget ledger, cache). The fixed seed keeps CI
    # deterministic; the long fuzz windows are local/manual evidence
    # recorded on the issue. Budget: 10 targets x -fuzztime=10s, packages
    # run in parallel by the go tool.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          cache: false

      - name: Fuzz smoke (fixed seed, bounded)
        # -fuzz takes a single target, so loop; GODEBUG=fuzzseed keeps the
        # short CI windows deterministic. 10 targets x 10s, well under the
        # ~3 minute budget for added CI time.
        run: |
          set -euo pipefail
          fuzz_one() { # package, target
            GODEBUG=fuzzseed=7 go test -run "^$2\$" -fuzz "^$2\$" -fuzztime=10s -count=1 "$1"
          }
          fuzz_one ./internal/protocol/canonical/ FuzzStreamPump
          fuzz_one ./internal/protocol/canonical/ FuzzResponseRoundTrip
          fuzz_one ./internal/protocol/canonical/ FuzzRequestRoundTrip
          fuzz_one ./internal/egress/ FuzzIPBlocked
          fuzz_one ./internal/egress/ FuzzEgressURL
          fuzz_one ./internal/budget/ FuzzLedgerOps
          fuzz_one ./internal/cache/ FuzzCacheOps
          fuzz_one ./internal/cache/ FuzzSemanticProvenance
          fuzz_one ./internal/cache/ FuzzCacheKey
          fuzz_one ./internal/httpapi/ FuzzStreamPumpClient

  integration-postgres:
    # Real-service integration evidence for the control-plane PostgreSQL
    # backend (M4-2): runs the build-tagged integration tests against a
    # disposable PostgreSQL service container. Ordinary unit jobs never
    # require this service.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexaroute
          POSTGRES_PASSWORD: nexaroute-ci-only
          POSTGRES_DB: nexaroute_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexaroute -d nexaroute_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          cache: false

      - name: PostgreSQL control-plane integration tests and outage drill
        env:
          NEXAROUTE_TEST_POSTGRES_DSN: "postgres://nexaroute:nexaroute-ci-only@127.0.0.1:5432/nexaroute_test?sslmode=disable"
        run: go test -tags integration ./internal/controlplane/ -run 'TestPostgresIntegration' -count=1 -v

      - name: PostgreSQL security-store integration tests
        env:
          NEXAROUTE_TEST_POSTGRES_DSN: "postgres://nexaroute:nexaroute-ci-only@127.0.0.1:5432/nexaroute_test?sslmode=disable"
        run: go test -tags integration ./internal/securitystore/ -run 'TestPostgresSecurityStoreIntegration' -count=1 -v

      - name: PostgreSQL shared breaker state-store integration tests
        env:
          NEXAROUTE_TEST_POSTGRES_DSN: "postgres://nexaroute:nexaroute-ci-only@127.0.0.1:5432/nexaroute_test?sslmode=disable"
        run: go test -tags integration ./internal/sharedstate/ -run 'TestPostgresBreakerStoreIntegration' -count=1 -v

      - name: PostgreSQL video job-store integration tests
        env:
          NEXAROUTE_TEST_POSTGRES_DSN: "postgres://nexaroute:nexaroute-ci-only@127.0.0.1:5432/nexaroute_test?sslmode=disable"
        run: go test -tags integration ./internal/video/queue/ -run 'TestPostgresVideoStore' -count=1 -v

      - name: PostgreSQL video cost-ledger integration tests
        env:
          NEXAROUTE_TEST_POSTGRES_DSN: "postgres://nexaroute:nexaroute-ci-only@127.0.0.1:5432/nexaroute_test?sslmode=disable"
        run: go test -tags integration ./internal/video/cost/ -run 'TestPostgresLedger' -count=1 -v

      - name: PostgreSQL breaker-sync two-instance integration tests
        env:
          NEXAROUTE_TEST_POSTGRES_DSN: "postgres://nexaroute:nexaroute-ci-only@127.0.0.1:5432/nexaroute_test?sslmode=disable"
        run: go test -tags integration ./internal/breakersync/ -run 'TestBreakerSyncPostgresTwoInstances' -count=1 -v

      - name: Gateway concurrent control-plane bootstrap integration
        env:
          NEXAROUTE_TEST_POSTGRES_DSN: "postgres://nexaroute:nexaroute-ci-only@127.0.0.1:5432/nexaroute_test?sslmode=disable"
        run: go test -tags integration ./cmd/gateway/ -run 'TestConcurrentPostgresControlPlaneBootstrapConverges' -count=1 -v

  integration-redis:
    # Real-service integration evidence for the control-plane Redis
    # backend (M4-2): runs the build-tagged integration tests against a
    # disposable Redis service container. Ordinary unit jobs never
    # require this service.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          cache: false

      - name: Redis control-plane integration tests and outage drill
        env:
          NEXAROUTE_TEST_REDIS_URL: "redis://127.0.0.1:6379/15"
        run: go test -tags integration ./internal/controlplane/ -run 'TestRedisIntegration' -count=1 -v

      - name: Redis security-store integration tests
        env:
          NEXAROUTE_TEST_REDIS_URL: "redis://127.0.0.1:6379/15"
        run: go test -tags integration ./internal/securitystore/ -run 'TestRedisSecurityStoreIntegration' -count=1 -v

      - name: Redis shared breaker state-store integration tests
        env:
          NEXAROUTE_TEST_REDIS_URL: "redis://127.0.0.1:6379/15"
        run: go test -tags integration ./internal/sharedstate/ -run 'TestRedisBreakerStoreIntegration' -count=1 -v

      - name: Redis breaker-sync two-instance integration tests
        env:
          NEXAROUTE_TEST_REDIS_URL: "redis://127.0.0.1:6379/15"
        run: go test -tags integration ./internal/breakersync/ -run 'TestBreakerSyncRedisTwoInstances' -count=1 -v

  container:
    # Deployment evidence (M4-4): the distroless image builds for both
    # architectures on every run (build only — publishing stays with
    # the release workflow), the amd64 image smoke-runs `--version`,
    # and the Helm chart lints + renders with its hardened posture
    # asserted. No cluster is involved; live installs stay UNVERIFIED
    # until exercised on one.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build image (amd64 + arm64, no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false

      - name: Build and smoke-run the amd64 image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: nexaroute:ci
          push: false

      - name: Smoke run prints the version and runs as nonroot
        run: |
          docker run --rm --entrypoint /nexaroute nexaroute:ci --version
          image_user="$(docker image inspect nexaroute:ci --format '{{.Config.User}}')"
          test -n "$image_user" && test "$image_user" != "root" && test "$image_user" != "0"

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.19.0

      - name: Lint and render the Helm chart, assert the hardened posture
        # Offline acceptance only (issue #650): lint, render with the
        # least-privilege acceptance values and with chart defaults,
        # posture/RBAC/probe/Recreate assertions, the secret-leak check
        # and the termination-grace vs. gateway-drain invariant. The
        # live kind-cluster phases are NOT run here; see
        # scripts/k8s-acceptance.sh --live and
        # docs/reports/K8S_ACCEPTANCE_2026-10-27.md.
        run: bash scripts/k8s-acceptance.sh --offline-only
