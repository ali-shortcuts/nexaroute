name: Browser evidence

# Evidence generation for #489 item 6: runs
# scripts/browser-evidence.mjs on a browser-capable runner (the
# supervisor sandbox's Chromium refuses loopback navigations) and
# preserves the capture as a run artifact. A maintainer then commits
# a reviewed complete artifact under docs/browser-evidence/m2-14/ in
# a follow-up PR that cites this run as provenance. Triggers are manual
# or path-filtered main-only pushes; this is not a merge gate and never
# writes to the repo.

on:
  workflow_dispatch:
  # Also preserve a fresh run artifact after browser UI/capture changes land on main.
  # Artifact-only; deliberately not a required merge check and never writes to the repo.
  push:
    branches: [main]
    paths:
      - ".github/workflows/browser-evidence.yml"
      - "internal/httpapi/**"
      - "cmd/gateway/**"
      - "scripts/browser-evidence.mjs"
      - "scripts/a11y/**"
      - "docs/browser-evidence/m2-14/README.md"

permissions:
  contents: read

concurrency:
  group: browser-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          cache: false

      # The runner image ships Node 20+ on PATH; no setup-node pin is
      # used anywhere else in this repo, so none is introduced here.
      - name: Show Node version
        run: node --version

      - name: Install browser evidence tools
        run: npm --prefix scripts/a11y install

      - name: Prepare isolated capture directory
        env:
          EVIDENCE_OUT: ${{ github.workspace }}/.artifacts/browser-evidence/${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          rm -rf "$EVIDENCE_OUT"
          mkdir -p "$EVIDENCE_OUT"
          echo "EVIDENCE_OUT=$EVIDENCE_OUT" >> "$GITHUB_ENV"

      - name: Capture browser evidence matrix
        id: capture
        env:
          # The runner sources this file before building the gateway;
          # an empty file keeps `go` resolution entirely with setup-go.
          GO_ENV: /dev/null
        run: node scripts/browser-evidence.mjs --out "$EVIDENCE_OUT"

      - name: Summarize browser evidence outcome
        if: always()
        run: |
          {
            echo '## Browser evidence'
            echo "Capture step outcome: ${{ steps.capture.outcome }}"
            echo 'Exit-code contract of scripts/browser-evidence.mjs: 0 = captured, 1 = axe serious/critical violations, 2 = environment blocked (no screenshots by design). A blocked run is not a successful evidence run, and an absent artifact under it is expected, not a second failure.'
            echo 'This workflow is optional evidence generation, not the mandatory browser acceptance gate (that is the CI verify job running scripts/run-browser-acceptance.py).'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve captured evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-evidence-m2-14-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ github.workspace }}/.artifacts/browser-evidence/${{ github.run_id }}-${{ github.run_attempt }}/
          retention-days: 90
          # warn, not error: a blocked environment (exit 2) produces no
          # screenshots by design, and the job failure is the signal.
          if-no-files-found: warn
