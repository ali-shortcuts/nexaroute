name: Propose browser evidence fixtures

on:
  workflow_run:
    workflows: ["Browser evidence"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  propose-fixture-pr:
    # Only consume artifacts from a successful evidence run on the protected main branch.
    if: ${{ github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source revision
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Skip stale evidence if main has advanced
        id: source
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git fetch origin main --quiet
          current="$(git rev-parse FETCH_HEAD)"
          if [[ "$current" != "$SOURCE_SHA" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Evidence was captured from $SOURCE_SHA but main is now $current; waiting for the newer main run."
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Download successful run artifact
        if: steps.source.outputs.skip != 'true'
        uses: actions/download-artifact@v4
        with:
          name: browser-evidence-m2-14-${{ github.event.workflow_run.head_sha }}-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: ${{ runner.temp }}/nexaroute-browser-evidence
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}

      - name: Validate manifest and prepare reviewable fixture candidate
        if: steps.source.outputs.skip != 'true'
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          EVIDENCE_DIR: ${{ runner.temp }}/nexaroute-browser-evidence
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const root = process.env.EVIDENCE_DIR;
          const manifestPath = path.join(root, 'manifest.json');
          if (!fs.existsSync(manifestPath)) throw new Error('Evidence artifact is missing manifest.json');
          const m = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          if (!Array.isArray(m.shots) || m.shots.length !== 112) {
            throw new Error('Expected exactly 112 screenshots in manifest; refusing partial fixture set');
          }
          const missing = m.shots.filter(s => !s.file || !fs.existsSync(path.join(root, s.file)));
          if (missing.length) throw new Error('Manifest references missing screenshots: ' + missing.map(s => s.file).slice(0, 8).join(', '));
          const blocking = Object.values(m.axe || {}).flat().filter(v => v.impact === 'serious' || v.impact === 'critical');
          if (blocking.length) throw new Error('Axe manifest still contains serious/critical violations; refusing to propose screenshots');
          let pngCount = 0;
          const walk = d => { for (const ent of fs.readdirSync(d, {withFileTypes:true})) { const p = path.join(d, ent.name); if (ent.isDirectory()) walk(p); else if (p.toLowerCase().endsWith('.png')) pngCount++; } };
          walk(root);
          if (pngCount !== 112) throw new Error('Expected 112 PNG files, found ' + pngCount);
          console.log('Validated 112 real screenshots, complete manifest, and no serious/critical axe violations.');
          NODE
          mkdir -p docs/browser-evidence/m2-14
          cp -a "$EVIDENCE_DIR"/. docs/browser-evidence/m2-14/
          cat > docs/browser-evidence/m2-14/PROVENANCE.md <<EOF
          # Browser evidence provenance

          - Source revision: `$SOURCE_SHA`
          - Workflow run: [$RUN_ID]($SERVER_URL/$REPOSITORY/actions/runs/$RUN_ID)
          - Run attempt: $RUN_ATTEMPT
          - Evidence: 112 screenshots generated by `scripts/browser-evidence.mjs` in the browser-capable GitHub runner.
          - Acceptance: artifact manifest validated; serious/critical axe violations were absent.
          - This fixture set was proposed through a pull request; it was not written directly to `main`.
          EOF

      - name: Open reviewable fixture PR
        if: steps.source.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          branch="bot/browser-evidence-${RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add docs/browser-evidence/m2-14/
          if git diff --cached --quiet; then
            echo "The captured fixture set is identical to the already committed set; no PR is needed."
            exit 0
          fi
          git commit -m "docs(evidence): add browser screenshots from run ${RUN_ID}"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "docs(evidence): add browser screenshot fixtures (run ${RUN_ID})" \
            --body "Closes #489

          This PR was generated only from a successful Browser evidence workflow run on main.
          - Source SHA: ${SOURCE_SHA}
          - Run: https://github.com/$GITHUB_REPOSITORY/actions/runs/${RUN_ID}
          - 112 PNG screenshots and manifest are taken directly from the workflow artifact, not fabricated.
          - The manifest was checked for completeness and absence of serious/critical axe violations.
          - The workflow only opens a reviewable PR; it does not write to main.

          Please review the fixture contents and run provenance before merging."
