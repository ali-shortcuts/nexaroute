name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  muse-implementation:
    if: |
      github.actor == 'ali-shortcuts' &&
      (
        startsWith(github.event.comment.body, '/opencode') ||
        startsWith(github.event.comment.body, '/oc ')
      )

    runs-on: ubuntu-latest
    timeout-minutes: 360

    permissions:
      id-token: write

    concurrency:
      group: opencode-${{ github.repository }}-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Muse Spark implementation
        uses: anomalyco/opencode/github@latest
        with:
          model: opencode/muse-spark-1.3-contributor-free
          prompt: |
            You are the primary end-to-end implementation agent for NexaRoute.

            The user's authoritative task is the exact GitHub comment that triggered this workflow:

            --- BEGIN USER TASK ---
            ${{ github.event.comment.body }}
            --- END USER TASK ---

            Execute that task completely and do not replace it with a planning-only response.

            Required operating rules:
            - Inspect the repository and prove current state before changing anything.
            - Read the full issue/PR thread for context before implementation.
            - Work on a unique branch; never force-push or rewrite history.
            - Preserve existing public APIs unless the user's task explicitly requires an additive compatible change.
            - Do not delete published tags or releases unless the user explicitly asks in a later instruction.
            - Fix confirmed bugs with regression tests.
            - For UI work, connect visuals to real backend data/events; do not fabricate telemetry.
            - Run all relevant tests and provide exact evidence.
            - Commit and push completed work.
            - Open a PR to main.
            - Do not merge unless required CI and Security checks are conclusively green.
            - If permissions prevent push/PR/merge/release, stop safely and report the exact blocker.
            - For releases, use the repository release workflow; never upload release binaries manually.
