name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  implementation:
    if: |
      github.actor == 'ali-shortcuts' &&
      (
        startsWith(github.event.comment.body, '/opencode') ||
        startsWith(github.event.comment.body, '/oc ')
      )

    runs-on: ubuntu-latest
    timeout-minutes: 360

    permissions:
      id-token: write

    concurrency:
      group: opencode-${{ github.repository }}-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select model
        id: pick
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          # Usage: first line of the comment, e.g. "/opencode model=nemotron"
          # No alias keeps the default (muse). Only whitelisted aliases are accepted.
          first_line=$(printf '%s' "$COMMENT_BODY" | head -n1)
          alias=$(printf '%s' "$first_line" | grep -oE 'model=[a-z0-9.-]+' | head -n1 | cut -d= -f2 || true)
          case "$alias" in
            ""|muse)        model="opencode/muse-spark-1.3-contributor-free" ;;
            nemotron)       model="opencode/nemotron-3-ultra-free" ;;
            mimo|mimo26)    model="opencode/mimo-v2.6-flash-free" ;;
            mimo25)         model="opencode/mimo-v2.5-free" ;;
            longcat)        model="opencode/longcat-2.5-preview-free" ;;
            pickle)         model="opencode/big-pickle" ;;
            *) echo "Unknown model alias: $alias (allowed: muse nemotron mimo mimo25 longcat pickle)"; exit 1 ;;
          esac
          echo "Using model: $model"
          echo "model=$model" >> "$GITHUB_OUTPUT"

      - name: OpenCode implementation
        uses: anomalyco/opencode/github@latest
        with:
          model: ${{ steps.pick.outputs.model }}
          prompt: |
            You are the primary end-to-end implementation agent for NexaRoute.

            The user's authoritative task is the exact GitHub comment that triggered this workflow:

            --- BEGIN USER TASK ---
            ${{ github.event.comment.body }}
            --- END USER TASK ---

            Execute that task completely and do not replace it with a planning-only response.

            Required operating rules:
            - Inspect the repository and prove current state before changing anything.
            - Read the full issue/PR thread for context before implementation.
            - Work on a unique branch; never force-push or rewrite history.
            - Preserve existing public APIs unless the user's task explicitly requires an additive compatible change.
            - Do not delete published tags or releases unless the user explicitly asks in a later instruction.
            - Fix confirmed bugs with regression tests.
            - For UI work, connect visuals to real backend data/events; do not fabricate telemetry.
            - Run all relevant tests and provide exact evidence.
            - Commit and push completed work.
            - Open a PR to main.
            - Do not merge unless required CI and Security checks are conclusively green.
            - If permissions prevent push/PR/merge/release, stop safely and report the exact blocker.
            - For releases, use the repository release workflow; never upload release binaries manually.
            - IMPORTANT: Never use /tmp or any path outside the checked-out repository for screenshots, browser evidence, test artifacts, generated reports, or files that must later be read/copied/committed.
            - Create all evidence directly under repository-owned paths such as docs/browser-evidence/, docs/reports/, .artifacts/, or another tracked/in-repo directory.
            - Do not perform any action that can trigger an interactive permission prompt in GitHub Actions. If a command would require permission to access an external directory, change the command/path so everything stays inside the repository.
            - Browser screenshots must be written directly to docs/browser-evidence/ from the test command itself; do not write them to /tmp and copy afterward.
            - Before long-running final gates, commit and push a coherent checkpoint branch so completed work is not lost if a later test times out or the runner is cancelled.
