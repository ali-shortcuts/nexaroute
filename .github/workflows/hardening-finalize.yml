name: NexaRoute v0.3 hardening finalizer

on:
  push:
    paths:
      - '.github/workflows/hardening-finalize.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Align module path and format
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r f; do
            sed -i 's#github.com/ali-shortcuts/universal-llm-gateway#github.com/ali-shortcuts/nexaroute#g' "$f"
          done < <(git grep -l 'github.com/ali-shortcuts/universal-llm-gateway' || true)
          gofmt -w cmd internal

      - name: Verify JavaScript
        run: node --check internal/httpapi/web/app.js

      - name: Unit and integration tests
        run: go test -shuffle=on ./...

      - name: Vet
        run: go vet ./...

      - name: Race detector
        run: go test -race ./...

      - name: Build Linux binaries
        run: |
          mkdir -p bin
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o bin/nexaroute-linux-amd64 ./cmd/gateway
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags='-s -w' -o bin/nexaroute-linux-arm64 ./cmd/gateway

      - name: Local smoke test
        run: ./scripts/smoke-local.sh

      - name: Commit verified source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Finalize NexaRoute v0.3 hardening"
          git push origin HEAD:main
