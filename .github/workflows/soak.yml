name: Soak

on:
  workflow_dispatch:
    inputs:
      rounds:
        description: Repeated stress rounds before same-process soak
        required: false
        default: "3"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/soak.yml"
      - "scripts/soak.sh"
      - "scripts/stress.sh"
      - "internal/**/soak_test.go"
      - "internal/**/stress_test.go"

permissions:
  contents: read

concurrency:
  group: soak-${{ github.ref }}
  cancel-in-progress: true

jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Repository cleanliness
        run: |
          set -euo pipefail
          bad_files="$(git ls-files | grep -Ei '(^|/)(backup|backups|old|legacy)(/|$)|\.bak$|\.orig$|\.rej$|~$' || true)"
          test -z "$bad_files"

      - name: Soak
        env:
          NEXAROUTE_SOAK_ROUNDS: ${{ inputs.rounds }}
        run: ./scripts/soak.sh
