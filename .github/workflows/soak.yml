name: Soak

on:
  workflow_dispatch:
    inputs:
      rounds:
        description: Repeated stress rounds before same-process soak
        required: false
        default: "3"
      duration:
        description: "Sustained mixed-workload duration (for example 30m or 2h; 0s disables). Long durations are opt-in only: dispatch this workflow by hand on a suitable runner, never from a normal PR."
        required: false
        default: "0s"
      timeout_minutes:
        description: "Job timeout; must exceed the sustained duration by at least 30 minutes (GitHub maximum 360). The guard step below fails fast if it does not."
        required: false
        default: "45"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/soak.yml"
      - "scripts/soak.sh"
      - "scripts/stress.sh"
      - "internal/**/soak_test.go"
      - "internal/**/stress_test.go"

permissions:
  contents: read

concurrency:
  group: soak-${{ github.ref }}
  cancel-in-progress: true

jobs:
  soak:
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ fromJSON(github.event.inputs.timeout_minutes || '45') }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          cache: false

      - name: Repository cleanliness
        run: |
          set -euo pipefail
          bad_files="$(git ls-files | grep -Ei '(^|/)(backup|backups|old|legacy)(/|$)|\.bak$|\.orig$|\.rej$|~$' || true)"
          test -z "$bad_files"

      - name: Fail fast if the job timeout cannot cover the soak
        # The script's other stages need roughly 30 minutes on top of
        # the sustained duration (see docs/reports/ISSUE664_SOAK_PROCEDURE.md).
        # Without this guard an operator dispatch of, say, 2h with the
        # default 45-minute timeout would be killed mid-soak and look
        # like a soak failure. Push runs carry no inputs and skip this.
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          SOAK_DURATION: ${{ github.event.inputs.duration }}
          SOAK_TIMEOUT_MINUTES: ${{ github.event.inputs.timeout_minutes }}
        run: |
          set -euo pipefail
          duration="${SOAK_DURATION}"
          timeout_minutes="${SOAK_TIMEOUT_MINUTES}"
          if ! [[ "$timeout_minutes" =~ ^[0-9]+$ ]]; then
            echo "timeout_minutes must be an integer, got '$timeout_minutes'" >&2
            exit 2
          fi
          if [[ "$duration" =~ ^([0-9]+)([smh])$ ]]; then
            value="${BASH_REMATCH[1]}"
            unit="${BASH_REMATCH[2]}"
            case "$unit" in
              s) duration_minutes=$(( (value + 59) / 60 )) ;;
              m) duration_minutes="$value" ;;
              h) duration_minutes=$((value * 60)) ;;
            esac
            required=$((duration_minutes + 30))
            if (( timeout_minutes < required )); then
              echo "timeout_minutes ($timeout_minutes) must be at least duration ($duration = ${duration_minutes}m) + 30m = ${required}m" >&2
              exit 2
            fi
            if (( timeout_minutes > 360 )); then
              echo "timeout_minutes must be <= 360 (GitHub maximum), got '$timeout_minutes'" >&2
              exit 2
            fi
          elif [[ "$duration" != "0" && "$duration" != "0s" && -n "$duration" ]]; then
            echo "duration must be a Go-style value like 30m or 2h, got '$duration'" >&2
            exit 2
          fi

      - name: Soak (record reproducible evidence)
        env:
          NEXAROUTE_SOAK_ROUNDS: ${{ github.event.inputs.rounds }}
          NEXAROUTE_SOAK_DURATION: ${{ github.event.inputs.duration }}
          NEXAROUTE_SOAK_OUT: ${{ github.workspace }}/.artifacts/soak
        run: ./scripts/soak.sh

      - name: Validate soak evidence completeness
        # The summary is the evidence; a job badge alone is not. This
        # gate fails the run when the summary is missing, names the
        # wrong commit, skips a planned stage, reports a sustained
        # duration shorter than requested, lacks resource samples for
        # a passed hot-reload stage, or omits the NOT_RUN block for
        # the live items (see scripts/check-soak-evidence.py).
        # It runs even when the soak step failed, because soak.sh
        # writes its summary from an EXIT trap in that case too.
        if: always()
        env:
          SOAK_DURATION: ${{ github.event.inputs.duration }}
        run: |
          set -euo pipefail
          summary="$(find "${{ github.workspace }}/.artifacts/soak" -name summary.json 2>/dev/null | sort | tail -n 1 || true)"
          if [ -z "$summary" ]; then
            echo 'No summary.json under .artifacts/soak: the soak script did not reach its report writer. That is a failure of the soak run, not a pass.' >&2
            exit 1
          fi
          echo "Validating $summary against commit ${{ github.sha }}"
          # Pin the summary to the dispatched duration instead of
          # trusting its own requested value: without this, a summary
          # that ran short but recorded a short request would pass.
          # Push runs carry no inputs, so the flag is omitted there
          # and the validator checks the summary's own request.
          duration_args=()
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            duration="${SOAK_DURATION}"
            if [[ "$duration" =~ ^([0-9]+)([smh])$ ]]; then
              value="${BASH_REMATCH[1]}"
              case "${BASH_REMATCH[2]}" in
                s) expected_seconds="$value" ;;
                m) expected_seconds=$((value * 60)) ;;
                h) expected_seconds=$((value * 3600)) ;;
              esac
              duration_args=(--expected-duration-seconds "$expected_seconds")
            elif [[ "$duration" == "0" ]]; then
              duration_args=(--expected-duration-seconds 0)
            elif [[ -n "$duration" ]]; then
              echo "duration must be a Go-style value like 30m or 2h, got '$duration'" >&2
              exit 2
            fi
          fi
          python3 scripts/check-soak-evidence.py --summary "$summary" --kind soak --expected-commit "${{ github.sha }}" "${duration_args[@]}"

      - name: Preserve raw soak evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: soak-${{ github.sha }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: .artifacts/soak/
          retention-days: 90
          if-no-files-found: error
