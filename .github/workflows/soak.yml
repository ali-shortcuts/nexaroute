name: Soak

on:
  workflow_dispatch:
    inputs:
      rounds:
        description: Repeated stress rounds before same-process soak
        required: false
        default: "3"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/soak.yml"
      - "scripts/soak.sh"
      - "scripts/stress.sh"
      - "internal/**/soak_test.go"
      - "internal/**/stress_test.go"

permissions:
  contents: read

concurrency:
  group: soak-${{ github.ref }}
  cancel-in-progress: true

jobs:
  soak:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          cache: false

      - name: Repository cleanliness
        run: |
          set -euo pipefail
          bad_files="$(git ls-files | grep -Ei '(^|/)(backup|backups|old|legacy)(/|$)|\.bak$|\.orig$|\.rej$|~$' || true)"
          test -z "$bad_files"

      - name: Soak (record reproducible evidence)
        env:
          NEXAROUTE_SOAK_ROUNDS: ${{ inputs.rounds }}
          NEXAROUTE_SOAK_OUT: ${{ github.workspace }}/.artifacts/soak
        run: ./scripts/soak.sh

      - name: Publish soak summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          summary="$(find .artifacts/soak -name summary.md -print -quit 2>/dev/null || true)"
          if [[ -n "$summary" ]]; then
            cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No soak summary was produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Preserve raw soak evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: soak-${{ github.sha }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: .artifacts/soak/
          retention-days: 90
          if-no-files-found: error
