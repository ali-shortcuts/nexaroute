name: Soak

on:
  workflow_dispatch:
    inputs:
      rounds:
        description: Repeated stress rounds before same-process soak
        required: false
        default: "3"
      duration:
        description: Sustained mixed-workload duration (for example 30m or 2h; 0s disables)
        required: false
        default: "0s"
      timeout_minutes:
        description: Job timeout; must comfortably exceed duration (GitHub maximum 360)
        required: false
        default: "45"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/soak.yml"
      - "scripts/soak.sh"
      - "scripts/stress.sh"
      - "internal/**/soak_test.go"
      - "internal/**/stress_test.go"

permissions:
  contents: read

concurrency:
  group: soak-${{ github.ref }}
  cancel-in-progress: true

jobs:
  soak:
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ fromJSON(inputs.timeout_minutes || '45') }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          cache: false

      - name: Repository cleanliness
        run: |
          set -euo pipefail
          bad_files="$(git ls-files | grep -Ei '(^|/)(backup|backups|old|legacy)(/|$)|\.bak$|\.orig$|\.rej$|~$' || true)"
          test -z "$bad_files"

      - name: Soak (record reproducible evidence)
        env:
          NEXAROUTE_SOAK_ROUNDS: ${{ inputs.rounds || '3' }}
          NEXAROUTE_SOAK_DURATION: ${{ inputs.duration || '0s' }}
          NEXAROUTE_SOAK_OUT: ${{ github.workspace }}/.artifacts/soak
        run: ./scripts/soak.sh

      - name: Preserve raw soak evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: soak-${{ github.sha }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: .artifacts/soak/
          retention-days: 90
          if-no-files-found: error
