name: Bootstrap source

on:
  push:
    paths:
      - '.bootstrap/final_08'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/final_00 .bootstrap/final_01 .bootstrap/final_02 \
              .bootstrap/final_03 .bootstrap/final_04 .bootstrap/final_05 \
              .bootstrap/final_06 .bootstrap/final_07 .bootstrap/final_08 \
              > /tmp/nexaroute-source.b64
          base64 -d /tmp/nexaroute-source.b64 > /tmp/nexaroute-source-v0.3.tar.xz
          echo "a9bcd0e5db08027388f61c34183370ab5bfbd73ea4c27dc2e38f43a6bd3cc112  /tmp/nexaroute-source-v0.3.tar.xz" | sha256sum -c -
          xz -t /tmp/nexaroute-source-v0.3.tar.xz
          tar -xJf /tmp/nexaroute-source-v0.3.tar.xz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-source.yml

      - name: Verify source
        shell: bash
        run: |
          set -euo pipefail
          go test ./...
          go vet ./...
          go test -race ./...
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o /tmp/nexaroute-linux-amd64 ./cmd/gateway
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o /tmp/nexaroute-linux-arm64 ./cmd/gateway

      - name: Commit source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish NexaRoute v0.3 source" || exit 0
          git push origin HEAD:main
