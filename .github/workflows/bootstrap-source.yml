name: Bootstrap source

on:
  push:
    paths:
      - '.bootstrap/publish_12'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
        continue-on-error: true

      - name: Reconstruct source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/publish_00 .bootstrap/publish_01 .bootstrap/publish_02 \
              .bootstrap/publish_03 .bootstrap/publish_04 .bootstrap/publish_05 \
              .bootstrap/publish_06 .bootstrap/publish_07 .bootstrap/publish_08 \
              .bootstrap/publish_09 .bootstrap/publish_10 .bootstrap/publish_11 \
              .bootstrap/publish_12 > /tmp/nexaroute-source.b64
          base64 -d /tmp/nexaroute-source.b64 > /tmp/nexaroute-source-v0.3.tar.xz
          echo "e3022ee185cdad85b30996d9abaef108747a220b17bed0317ea174ba1f0b6d7f  /tmp/nexaroute-source-v0.3.tar.xz" | sha256sum -c -
          xz -t /tmp/nexaroute-source-v0.3.tar.xz
          tar -xJf /tmp/nexaroute-source-v0.3.tar.xz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-source.yml

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify source
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(gofmt -l cmd internal)"
          go test -shuffle=on ./...
          go vet ./...
          go test -race ./...
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o /tmp/nexaroute-linux-amd64 ./cmd/gateway
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o /tmp/nexaroute-linux-arm64 ./cmd/gateway

      - name: Commit verified source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish verified NexaRoute v0.3 source"
          git push origin HEAD:main
