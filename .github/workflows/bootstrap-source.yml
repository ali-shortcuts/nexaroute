# Bootstrap after all archive chunks are present.
name: Bootstrap source

on:
  push:
    paths:
      - '.bootstrap/**'
      - '.github/workflows/bootstrap-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and validate source archive
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, subprocess, sys

          root = Path('.bootstrap')
          before = ''.join((root / n).read_text() for n in [
              'chunk01', 'chunk02_03', 'chunk04_05'
          ])
          middle = (root / 'chunk06_07').read_text()
          after = ''.join((root / n).read_text() for n in [
              'chunk08_09', 'chunk10_11', 'chunk12'
          ])

          alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'
          out = Path('/tmp/nexaroute-source-v0.3.tar.xz')
          found = None

          for pos in range(7596, 7605):
              for ch in alphabet:
                  text = before + middle[:pos] + ch + middle[pos:] + after
                  if len(text) % 4:
                      continue
                  try:
                      data = base64.b64decode(text, validate=True)
                  except Exception:
                      continue
                  out.write_bytes(data)
                  ok = subprocess.run(['xz', '-t', str(out)], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
                  if ok.returncode == 0:
                      found = (pos, ch, len(text), len(data))
                      break
              if found:
                  break

          if not found:
              print('Unable to reconstruct a valid XZ archive', file=sys.stderr)
              sys.exit(1)

          print(f'Repaired archive at position={found[0]} char={found[1]!r} base64_bytes={found[2]} archive_bytes={found[3]}')
          PY
          tar -xJf /tmp/nexaroute-source-v0.3.tar.xz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-source.yml

      - name: Commit source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish NexaRoute v0.3 source" || exit 0
          git push origin HEAD:main
