# Bootstrap after all archive chunks are present.
name: Bootstrap source

on:
  push:
    paths:
      - '.bootstrap/**'
      - '.github/workflows/bootstrap-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/chunk01 \
              .bootstrap/chunk02_03 \
              .bootstrap/chunk04_05 \
              .bootstrap/chunk06_07 \
              .bootstrap/chunk08_09 \
              .bootstrap/chunk10_11 \
              .bootstrap/chunk12 > /tmp/nexaroute-source.b64
          base64 -d /tmp/nexaroute-source.b64 > /tmp/nexaroute-source-v0.3.tar.xz
          tar -xJf /tmp/nexaroute-source-v0.3.tar.xz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-source.yml

      - name: Commit source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish NexaRoute v0.3 source" || exit 0
          git push origin HEAD:main
