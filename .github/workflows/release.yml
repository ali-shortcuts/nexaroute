name: Release build
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - name: Verify source
        run: ./scripts/verify.sh
      - name: Local runtime smoke test
        run: ./scripts/smoke-local.sh
      - name: Docker build
        run: docker build --tag nexaroute-release:${GITHUB_REF_NAME} .
      - name: Build checksum-verified release packages
        run: ./scripts/package-release.sh
      - name: Verify packaged installer and upgrade
        run: ./scripts/test-installer.sh
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/*.tar.gz
            dist/nexaroute-windows-amd64.exe
            dist/SHA256SUMS
          generate_release_notes: true
