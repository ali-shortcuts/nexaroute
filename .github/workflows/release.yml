name: Release

# Canonical stable release pipeline. A v* tag pushed on main publishes the
# exact tested tag commit as a GitHub Release with the integrated gateway,
# videogen utility, installer, configuration and documentation bundle.
# workflow_dispatch runs the identical verification without publishing.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build and verify (for example v0.9.1)'
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          cache: false

      - name: Release vulnerability gate (govulncheck)
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-input: '1.27.x'
          go-package: ./...
          cache: false

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME}"
          else
            version="${{ inputs.version }}"
          fi
          [[ "$version" =~ ^v[0-9][a-zA-Z0-9._-]*$ ]] || {
            echo "Invalid release version: $version" >&2
            exit 1
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Repository cleanliness
        shell: bash
        run: |
          set -euo pipefail
          bad_files="$(git ls-files | grep -Ei '(^|/)(backup|backups|old|legacy)(/|$)|\.bak$|\.orig$|\.rej$|~$' || true)"
          if [ -n "$bad_files" ]; then
            echo "Forbidden backup/legacy artifacts:"
            echo "$bad_files"
            exit 1
          fi
          if git grep -nE 'LoadBackup|adminRollback|/admin/api/rollback|rollbackBtn|ulg_admin_key|ULG_CONFIG|ULG_LISTEN|ULG_ADMIN_KEY|ULG_ADMIN_BIND_LOCAL_ONLY|universal-llm-gateway' -- . ':(exclude).github/workflows'; then
            echo "Forbidden backup/legacy identifiers remain in active source/docs."
            exit 1
          fi

      - name: Full verification
        run: ./scripts/verify.sh

      - name: Bounded stress checks
        run: ./scripts/stress.sh

      - name: Local runtime smoke test
        run: ./scripts/smoke-local.sh

      - name: Build release assets
        run: ./scripts/build-release.sh "${{ steps.version.outputs.version }}"

      - name: Generate SBOM (Syft, pinned and checksum-verified)
        run: ./scripts/generate-sbom.sh "${{ steps.version.outputs.version }}"

      - name: Finalize checksums (now including the SBOM)
        run: ./scripts/write-checksums.sh dist

      - name: Verify release artifacts (manifest coverage and SBOM contents)
        env:
          EXPECTED_SOURCE_COMMIT: ${{ github.sha }}
        run: ./scripts/verify-release.sh dist "${{ steps.version.outputs.version }}"

      - name: Integrated release smoke
        run: ./scripts/release-smoke.sh dist

      - name: Installer lifecycle tests
        run: ./scripts/test-install.sh

      - name: Verify checksums
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c SHA256SUMS)
          required="nexaroute-linux-amd64 nexaroute-linux-arm64 nexaroute-videogen-linux-amd64 nexaroute-videogen-linux-arm64 install.sh video.example.json VIDEO_GATEWAY.md RELEASE_NOTES.md SHA256SUMS nexaroute-${{ steps.version.outputs.version }}-sbom.spdx.json"
          for f in $required; do
            [[ -s "dist/$f" ]] || { echo "missing release asset: $f" >&2; exit 1; }
          done
          cmp -s scripts/install.sh dist/install.sh || {
            echo "dist/install.sh is not identical to scripts/install.sh" >&2
            exit 1
          }

      - name: Verify embedded version
        shell: bash
        run: |
          set -euo pipefail
          want="${{ steps.version.outputs.version }}"
          got="$(./dist/nexaroute-linux-amd64 -version)"
          echo "$got"
          [[ "$got" == *"v${want#v}"* ]] || {
            echo "binary version mismatch: got '$got' want 'v${want#v}'" >&2
            exit 1
          }
          videogen_got="$(./dist/nexaroute-videogen-linux-amd64 -version)"
          echo "$videogen_got"
          [[ "$videogen_got" == *"v${want#v}"* ]] || {
            echo "videogen version mismatch: got '$videogen_got' want 'v${want#v}'" >&2
            exit 1
          }

      - name: Upload release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nexaroute-release-${{ steps.version.outputs.version }}
          path: |
            dist/nexaroute-linux-amd64
            dist/nexaroute-linux-arm64
            dist/nexaroute-videogen-linux-amd64
            dist/nexaroute-videogen-linux-arm64
            dist/install.sh
            dist/video.example.json
            dist/VIDEO_GATEWAY.md
            dist/RELEASE_NOTES.md
            dist/SHA256SUMS
            dist/nexaroute-${{ steps.version.outputs.version }}-sbom.spdx.json
          if-no-files-found: error

      - name: Download release artifact for workflow_dispatch dry-run
        if: github.event_name == 'workflow_dispatch'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nexaroute-release-${{ steps.version.outputs.version }}
          path: dist-roundtrip

      - name: Verify workflow_dispatch artifact round-trip
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          EXPECTED_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          required="nexaroute-linux-amd64 nexaroute-linux-arm64 nexaroute-videogen-linux-amd64 nexaroute-videogen-linux-arm64 install.sh video.example.json VIDEO_GATEWAY.md RELEASE_NOTES.md SHA256SUMS nexaroute-${{ steps.version.outputs.version }}-sbom.spdx.json"
          for f in $required; do
            [[ -s "dist-roundtrip/$f" ]] || { echo "missing downloaded release asset: $f" >&2; exit 1; }
            cmp -s "dist/$f" "dist-roundtrip/$f" || { echo "artifact round-trip changed: $f" >&2; exit 1; }
          done
          (cd dist-roundtrip && sha256sum -c SHA256SUMS)
          ./scripts/verify-release.sh dist-roundtrip "${{ steps.version.outputs.version }}"
          echo 'ARTIFACT ROUND-TRIP PASS — workflow_dispatch remains non-publishing.'

      - name: Install Cosign (dry-run signing mechanics test)
        if: github.event_name == 'workflow_dispatch'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.3'

      - name: Signing mechanics test (ephemeral key, NOT the release identity)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          COSIGN_PASSWORD: ""
        run: |
          set -euo pipefail
          # Exercises sign + verify mechanics only. The ephemeral key is
          # generated inside this job, never stored or uploaded, and is
          # NOT the release identity; real releases are signed with
          # Sigstore keyless OIDC in the publish job. Nothing produced
          # here is published or attached to the release artifact set.
          t="$(mktemp -d)"
          cp dist/SHA256SUMS "$t/"
          (cd "$t" && cosign generate-key-pair >/dev/null)
          (cd "$t" && cosign sign-blob --key cosign.key --bundle SHA256SUMS.cosign.bundle --yes SHA256SUMS >/dev/null)
          (cd "$t" && cosign verify-blob --key cosign.pub --bundle SHA256SUMS.cosign.bundle SHA256SUMS)
          echo 'SIGNING MECHANICS PASS — ephemeral test key only; the keyless release path runs on tag publishes.'

  publish:
    needs: verify
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      # Only this job may mint an OIDC token, for Sigstore keyless signing.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tag must point at a commit on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=200
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag ${GITHUB_REF_NAME} points at $GITHUB_SHA which is not on main." >&2
            echo "Releases are published only from tested main commits." >&2
            exit 1
          fi

      - name: Download verified assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nexaroute-release-${{ github.ref_name }}
          path: dist

      - name: Verify checksums before publishing
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c SHA256SUMS)

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.3'

      - name: Sign checksum manifest (Sigstore keyless via GitHub OIDC)
        shell: bash
        run: |
          set -euo pipefail
          cosign sign-blob --bundle dist/SHA256SUMS.cosign.bundle --yes dist/SHA256SUMS

      - name: Verify the signature against the pinned release-workflow identity
        shell: bash
        run: |
          set -euo pipefail
          cosign verify-blob \
            --bundle dist/SHA256SUMS.cosign.bundle \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/tags/${{ github.ref_name }}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            dist/SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --title "NexaRoute $tag" \
            --latest \
            dist/nexaroute-linux-amd64 \
            dist/nexaroute-linux-arm64 \
            dist/nexaroute-videogen-linux-amd64 \
            dist/nexaroute-videogen-linux-arm64 \
            dist/install.sh \
            dist/video.example.json \
            dist/VIDEO_GATEWAY.md \
            dist/RELEASE_NOTES.md \
            dist/SHA256SUMS \
            dist/nexaroute-${{ github.ref_name }}-sbom.spdx.json \
            dist/SHA256SUMS.cosign.bundle
