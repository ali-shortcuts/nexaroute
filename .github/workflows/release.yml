name: Release

# Canonical stable release pipeline. A v* tag pushed on main publishes the
# exact tested tag commit as a GitHub Release with the four required assets.
# workflow_dispatch runs the identical verification without publishing.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build and verify (for example v0.7.0)'
        required: true
        default: v0.7.0

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: false

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME}"
          else
            version="${{ inputs.version }}"
          fi
          [[ "$version" =~ ^v[0-9][a-zA-Z0-9._-]*$ ]] || {
            echo "Invalid release version: $version" >&2
            exit 1
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Repository cleanliness
        shell: bash
        run: |
          set -euo pipefail
          bad_files="$(git ls-files | grep -Ei '(^|/)(backup|backups|old|legacy)(/|$)|\.bak$|\.orig$|\.rej$|~$' || true)"
          if [ -n "$bad_files" ]; then
            echo "Forbidden backup/legacy artifacts:"
            echo "$bad_files"
            exit 1
          fi
          if git grep -nE 'LoadBackup|adminRollback|/admin/api/rollback|rollbackBtn|ulg_admin_key|ULG_CONFIG|ULG_LISTEN|ULG_ADMIN_KEY|ULG_ADMIN_BIND_LOCAL_ONLY|universal-llm-gateway' -- . ':(exclude).github/workflows'; then
            echo "Forbidden backup/legacy identifiers remain in active source/docs."
            exit 1
          fi

      - name: Full verification
        run: ./scripts/verify.sh

      - name: Bounded stress checks
        run: ./scripts/stress.sh

      - name: Local runtime smoke test
        run: ./scripts/smoke-local.sh

      - name: Build release assets
        run: ./scripts/build-release.sh "${{ steps.version.outputs.version }}"

      - name: Installer lifecycle tests
        run: ./scripts/test-install.sh

      - name: Verify checksums
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c SHA256SUMS)
          required="nexaroute-linux-amd64 nexaroute-linux-arm64 install.sh SHA256SUMS"
          for f in $required; do
            [[ -s "dist/$f" ]] || { echo "missing release asset: $f" >&2; exit 1; }
          done
          cmp -s scripts/install.sh dist/install.sh || {
            echo "dist/install.sh is not identical to scripts/install.sh" >&2
            exit 1
          }

      - name: Verify embedded version
        shell: bash
        run: |
          set -euo pipefail
          want="${{ steps.version.outputs.version }}"
          got="$(./dist/nexaroute-linux-amd64 -version)"
          echo "$got"
          [[ "$got" == *"v${want#v}"* ]] || {
            echo "binary version mismatch: got '$got' want 'v${want#v}'" >&2
            exit 1
          }

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: nexaroute-release-${{ steps.version.outputs.version }}
          path: |
            dist/nexaroute-linux-amd64
            dist/nexaroute-linux-arm64
            dist/install.sh
            dist/SHA256SUMS
          if-no-files-found: error

  publish:
    needs: verify
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Tag must point at a commit on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=200
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag ${GITHUB_REF_NAME} points at $GITHUB_SHA which is not on main." >&2
            echo "Releases are published only from tested main commits." >&2
            exit 1
          fi

      - name: Download verified assets
        uses: actions/download-artifact@v4
        with:
          name: nexaroute-release-${{ github.ref_name }}
          path: dist

      - name: Verify checksums before publishing
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c SHA256SUMS)

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --title "NexaRoute $tag" \
            --latest \
            dist/nexaroute-linux-amd64 \
            dist/nexaroute-linux-arm64 \
            dist/install.sh \
            dist/SHA256SUMS
