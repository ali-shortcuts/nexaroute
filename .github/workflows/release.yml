name: Prepare release (no publishing)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Future release tag (for example v0.6.0)'
        required: true
        default: v0.6.0

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Verify source and both architectures
        run: ./scripts/verify.sh
      - name: Stress tests
        run: ./scripts/stress.sh
      - name: Runtime smoke test
        run: ./scripts/smoke-local.sh
      - name: Prepare exact release assets
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: ./scripts/build-release.sh "$RELEASE_VERSION"
      - name: Installer and desktop lifecycle tests
        run: ./scripts/test-install.sh
      - name: Retain artifacts for release review (not a GitHub Release)
        uses: actions/upload-artifact@v4
        with:
          name: nexaroute-release-candidate
          path: |
            dist/nexaroute-linux-amd64
            dist/nexaroute-linux-arm64
            dist/install.sh
            dist/SHA256SUMS
          if-no-files-found: error
