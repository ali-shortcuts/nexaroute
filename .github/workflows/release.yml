name: Release build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Verify source
        run: ./scripts/verify.sh

      - name: Local runtime smoke test
        run: ./scripts/smoke-local.sh

      - name: Docker build
        run: docker build --tag nexaroute-release:${GITHUB_REF_NAME} .

      - name: Build release artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o dist/nexaroute-linux-amd64 ./cmd/gateway
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags='-s -w' -o dist/nexaroute-linux-arm64 ./cmd/gateway
          (cd dist && sha256sum nexaroute-linux-* > SHA256SUMS)

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/nexaroute-linux-amd64
            dist/nexaroute-linux-arm64
            dist/SHA256SUMS
          generate_release_notes: true
