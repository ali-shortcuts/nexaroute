name: Install acceptance

# One-shot acceptance test for the REAL public installer. Runs the documented
# curl | bash command in a clean Debian container (no Go, no git) with a fresh
# HOME, then repeats the same install to prove safe update/reinstall.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-install:
    runs-on: ubuntu-latest
    container: debian:bookworm-slim
    timeout-minutes: 20
    steps:
      - name: Clean-container public installer test
        shell: bash
        run: |
          set -euo pipefail
          echo "== clean environment: no Go, no git =="
          if command -v go >/dev/null 2>&1; then echo "FAIL: go is present"; exit 1; fi
          if command -v git >/dev/null 2>&1; then echo "FAIL: git is present"; exit 1; fi
          echo "OK: no go, no git"
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends curl ca-certificates
          export HOME=/cleanhome
          mkdir -p "$HOME"
          cd "$HOME"

          echo "== real latest URL resolves to the stable release =="
          loc="$(curl -s -o /dev/null -w '%{redirect_url}' https://github.com/ali-shortcuts/nexaroute/releases/latest/download/install.sh)"
          echo "latest -> $loc"
          case "$loc" in
            */releases/download/v0.7.0/install.sh) echo "OK: latest resolves to v0.7.0" ;;
            *) echo "FAIL: unexpected latest target: $loc"; exit 1 ;;
          esac

          echo "== FIRST INSTALL: real public command =="
          curl -fsSL https://github.com/ali-shortcuts/nexaroute/releases/latest/download/install.sh | bash
          installed="$(command -v nexaroute)"
          echo "on PATH: $installed"
          case "$installed" in /usr/local/bin/nexaroute) ;; *) echo "FAIL: unexpected install location"; exit 1 ;; esac
          ver="$(nexaroute -version)"
          echo "version: $ver"
          case "$ver" in *v0.7.0*) ;; *) echo "FAIL: unexpected version"; exit 1 ;; esac

          echo "== start and UI responds =="
          nexaroute -no-browser > /tmp/nx1.log 2>&1 &
          pid=$!
          for _ in $(seq 1 120); do
            curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1 && break
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:8080/healthz >/dev/null
          curl -fsS http://127.0.0.1:8080/ | head -c 4000 | grep -qi nexaroute
          echo "OK: healthz + UI respond"

          echo "== config created and persisted =="
          cfg="$HOME/.config/nexaroute/config.json"
          test -f "$cfg"
          mode="$(stat -c '%a' "$cfg")"
          test "$mode" = "600" || { echo "FAIL: config mode $mode"; exit 1; }
          sum1="$(sha256sum "$cfg" | awk '{print $1}')"
          echo "config sha256: $sum1"
          printf 'canary-%s\n' "$$" > "$HOME/.config/nexaroute/canary.txt"
          kill "$pid"
          wait "$pid" 2>/dev/null || true

          echo "== SECOND INSTALL: same public command (update/reinstall) =="
          curl -fsSL https://github.com/ali-shortcuts/nexaroute/releases/latest/download/install.sh | bash
          installed="$(command -v nexaroute)"
          test -f "$HOME/.config/nexaroute/canary.txt"
          sum2="$(sha256sum "$cfg" | awk '{print $1}')"
          echo "config sha256 after reinstall: $sum2"
          test "$sum1" = "$sum2" || { echo "FAIL: config changed on reinstall"; exit 1; }
          ver="$(nexaroute -version)"
          case "$ver" in *v0.7.0*) ;; *) echo "FAIL: unexpected version after reinstall"; exit 1 ;; esac

          echo "== restart after reinstall =="
          nexaroute -no-browser > /tmp/nx2.log 2>&1 &
          pid=$!
          for _ in $(seq 1 120); do
            curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1 && break
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:8080/healthz >/dev/null
          kill "$pid"
          wait "$pid" 2>/dev/null || true

          echo "== leftover state =="
          ls -la "$HOME/.config/nexaroute"
          head -5 /tmp/nx1.log
          echo "PUBLIC INSTALL TEST PASS"
