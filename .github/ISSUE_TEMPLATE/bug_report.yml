name: Bug report
description: Report a reproducible ULG problem
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not paste API keys, tokens, cookies, or provider secrets."
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: v0.3 or commit SHA
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS / architecture
      placeholder: Ubuntu 24.04 amd64
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Redact all credentials and personal data.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      render: shell
